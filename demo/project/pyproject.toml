[project]
name = 'orders-demo'
version = '0.1.0'
requires-python = '>=3.10'
dependencies = [
    "apache-airflow==3.1.*",  # the Airflow this project runs: the one place the version is stated
    "apache-airflow-providers-standard",  # Airflow 3's home for the classic operators (Bash, Python, Empty)
]

# ---------------------------------------------------------------------------
# [tool.astro] — the bit that makes this a normal Python project AND an Astro
# project. Everything the CLI reads lives under here. Full key list:
# docs/manifest-reference.md.
# ---------------------------------------------------------------------------
[tool.astro]
packages = ['libpq-dev']  # apt packages: installed in Docker mode, warned about in standalone
workspace = 'your-workspace-id'  # default workspace every astro link inherits

# ---------------------------------------------------------------------------
# [tool.astro.env] — the environment this project expects.
# A string is a committed default. A table means the value lives outside the
# manifest. Every declared name is required by default: `astro local start`
# refuses with the list of what to set, and `optional = true` exempts one.
# No secret is ever legal in this file.
# ---------------------------------------------------------------------------
[tool.astro.env]
LOG_LEVEL = 'info'  # a committed default: no one has to set it
# Resolves from the workspace's Environment Manager when you are logged in;
# below that, set it locally like any other value.
ORDERS_API_URL = { source = 'workspace' }
# Required with no default — this is the clone-and-run gate. A teammate who
# clones this repo is told exactly this name and the command to set it.
WAREHOUSE_URI = {}

[tool.astro.env.connections]
warehouse = {}  # required; resolves as AIRFLOW_CONN_WAREHOUSE

[tool.astro.env.airflow_variables]
batch_size = '500'  # a default; resolves as AIRFLOW_VAR_BATCH_SIZE

# ---------------------------------------------------------------------------
# [tool.astro.deployments.*] — the committed inventory of Airflows this
# project talks to. One table per Airflow, four kinds. A clone of this repo
# has the same list you do, with nothing to pass around.
# ---------------------------------------------------------------------------

[tool.astro.deployments.dev]  # an Astro link: coordinates are a Deployment id
deployment = 'your-dev-deployment-id'

[tool.astro.deployments.prod]
deployment = 'your-prod-deployment-id'
default = true  # `astro deploy` with no link named ships here

# The three links below are the committed inventory: every clone has the same
# list. Resolution, auth, and the query commands work for all of them today —
# bare `astro use` lists them, `astro af dags list -d prod-mwaa` reads one, and
# each opens the door its platform wants. What is still missing is an
# `astro deploy` that ships to a non-Astro link. (`astro package mwaa` and
# `astro package composer` do build artifacts today, but packaging is driven
# by the target name on the command line, not by these links.)
[tool.astro.deployments.prod-mwaa]  # an MWAA link: coordinates are an environment name
target = 'mwaa'
environment = 'orders-demo-mwaa'

[tool.astro.deployments.prod-composer]  # a Composer link
target = 'composer'
environment = 'orders-demo-composer'

# An endpoint link: an Airflow with no control plane to ask. It needs an auth
# table, because nothing about a URL says how its Airflow checks callers.
# `token-env` names the environment variable holding the token — never the
# token.
[tool.astro.deployments.staging]
url = 'https://airflow.staging.example.com'
auth = { method = 'token', token-env = 'STAGING_AIRFLOW_TOKEN' }

# ---------------------------------------------------------------------------
# [tool.astro.targets.*] — backend config, plain data, carried through
# untyped. Note the plural: `target` (singular) is the default target NAME,
# and one TOML key cannot be both a string and a table.
#
# An MWAA or Composer link takes the rest of its coordinates from here — the
# link names the environment, this says where that environment lives. `region`
# and `project`/`location` are read when the CLI opens a door to one, and
# `bucket` fills in the upload `astro package mwaa` prints, so fill them from
# the terraform outputs (see demo/terraform/).
# ---------------------------------------------------------------------------
[tool.astro.targets.mwaa]
region = 'us-east-1'
bucket = 's3://your-mwaa-bucket'

[tool.astro.targets.composer]
project = 'your-gcp-project'
location = 'us-central1'

# ---------------------------------------------------------------------------
# Standard Python tooling from here down. The CLI does not read any of it;
# your linter, type checker, and test runner do. That is the point: an Astro
# project is a normal Python project.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = ["ruff", "ty", "pytest"]  # uv sync installs this group by default

[tool.pytest.ini_options]
# dags/ holds a shared helper module the DAGs import. Airflow puts the DAG
# folder on sys.path when it parses; pytest needs telling.
pythonpath = ["dags"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # pycodestyle, pyflakes, import sorting, pyupgrade

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
invalid-argument-type = "ignore"  # Airflow's @task decorator returns XComArg, so a checker flags every TaskFlow chain
