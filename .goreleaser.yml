project_name: astro
version: 2
before:
  hooks:
    - go mod download
release:
  github:
    owner: astronomer
    name: astro-cli
  # "auto" marks prerelease tags (e.g. v1.43.0-rc.1, v1.43.0-nightly.20260522) as prerelease,
  # and clean semver tags (e.g. v1.43.0) as full releases.
  prerelease: auto
  # Only a full release of the stable major (STABLE_MAJOR in the release workflows) becomes
  # GitHub's "latest" release. GitHub refuses to make a prerelease latest, and goreleaser
  # fails the publish when asked to.
  make_latest: '{{ if and (eq (print .Major) .Env.STABLE_MAJOR) (eq .Prerelease "") }}true{{ else }}false{{ end }}'
  # install.sh is godownloader.sh with LATEST_VERSION set to this release, so
  # the asset installs the release it ships with and nothing else.
  extra_files:
    - glob: ./install.sh
changelog:
  sort: asc
  use: github
builds:
  - id: darwin-build
    main: main.go
    binary: astro
    env:
      - CGO_ENABLED=1
      - CC=clang
      - CXX=clang++
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    ldflags: -s -w -X github.com/astronomer/astro-cli/version.CurrVersion={{ .Version }}
  - id: linux-build
    main: main.go
    binary: astro
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - 386
      - arm64
      - amd64
    ldflags: -s -w -X github.com/astronomer/astro-cli/version.CurrVersion={{ .Version }}
  - id: windows-build
    main: main.go
    binary: astro
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags: -s -w -X github.com/astronomer/astro-cli/version.CurrVersion={{ .Version }}
# Sign the macOS binaries with Astronomer's Developer ID Application certificate and
# notarize them with Apple, so Gatekeeper and endpoint-security tools that trust by
# Team ID accept each release without per-version allowlisting. goreleaser's quill
# backend signs bare Mach-O binaries with the hardened runtime, before they are archived.
# A bare binary can't carry a stapled ticket; Gatekeeper looks the ticket up online.
# Disabled when the certificate is unset or empty (forks, local snapshots, and Actions,
# which passes a missing secret as an empty string).
notarize:
  macos:
    - enabled: '{{ ne (envOrDefault "MACOS_SIGN_P12" "") "" }}'
      ids:
        - darwin-build
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m
brews:
  - name: astro
    repository:
      owner: astronomer
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      branch: "bump-astro-{{ .Version }}"
      pull_request:
        enabled: true
        base:
          owner: astronomer
          name: homebrew-tap
          branch: main
    directory: Formula
    skip_upload: '{{ if eq (print .Major) .Env.STABLE_MAJOR }}auto{{ else }}true{{ end }}'
    homepage: https://astronomer.io
    description: To build and run Airflow Dags locally via docker-compose and deploy Dags to Astronomer-managed Airflow clusters and interact with the Astronomer API.
    dependencies:
      - name: podman
        type: recommended
        os: mac
    test: |
      system "#{bin}/astro version"
  - name: "astro@{{ .Version }}"
    repository:
      owner: astronomer
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      branch: "bump-astro-versioned-{{ .Version }}"
      pull_request:
        enabled: true
        base:
          owner: astronomer
          name: homebrew-tap
          branch: main
    directory: Formula
    skip_upload: '{{ if eq (print .Major) .Env.STABLE_MAJOR }}auto{{ else }}true{{ end }}'
    homepage: https://astronomer.io
    description: To build and run Airflow Dags locally via docker-compose and deploy Dags to Astronomer-managed Airflow clusters and interact with the Astronomer API.
    dependencies:
      - name: podman
        type: recommended
        os: mac
    test: |
      system "#{bin}/astro version"
archives:
  - id: unix-archives
    builds:
      - darwin-build
      - linux-build
    format: tar.gz
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README*
  - id: windows-exe
    builds:
      - windows-build
    format: binary
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: windows-zip
    builds:
      - windows-build
    format: zip
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README*
snapshot:
  name_template: SNAPSHOT-{{ .Commit }}
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  extra_files:
    - glob: ./install.sh
