<!DOCTYPE html>
<html lang="en"><head>
{{template "head" .Title}}
<style>
.page { align-items: flex-start; }
.wrap { width: 100%; max-width: 760px; }
header { display: flex; align-items: center; gap: 18px; margin-bottom: 32px; }
header .orbit { --size: 56px; margin: 0; flex-shrink: 0; }
header .orbit .planet { width: 8px; height: 8px; }
header .orbit .moon { width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; }
header h1 { margin-top: 2px; }
.count { color: var(--faint); font-size: 14px; margin-bottom: 14px; }
ul { list-style: none; display: grid; gap: 10px; }
li a.card {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 16px;
  padding: 16px 20px;
  border-radius: 10px;
  background: var(--card);
  color: var(--text);
  transition: background 0.15s, transform 0.15s;
}
li a.card:hover { background: var(--card-hover); text-decoration: none; transform: translateY(-1px); }
.name { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 10px; min-width: 0; overflow-wrap: anywhere; }
.name::before {
  content: "";
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--glow);
  flex-shrink: 0;
}
.url { color: var(--accent); font-size: 14px; overflow-wrap: anywhere; }
.port { grid-row: 1; grid-column: 2; align-self: center; }
.dir { grid-column: 1 / -1; font-family: var(--mono); font-size: 12px; color: var(--faint); overflow-wrap: anywhere; }
.empty { text-align: center; padding: 56px 0 24px; }
.empty .orbit { margin-bottom: 28px; }
.empty h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
</style>
</head><body>
{{template "sky"}}
<main class="page">
  <div class="wrap">
    <header>
      <div class="orbit" aria-hidden="true">
        <div class="ring ring-1"></div>
        <div class="ring ring-3"></div>
        <div class="planet"></div>
        <div class="moon"></div>
      </div>
      <div>
        <p class="eyebrow">Mission control</p>
        <h1>{{.Title}}</h1>
      </div>
    </header>
{{- if not .Routes}}
    <section class="empty">
      <div class="orbit" aria-hidden="true">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <div class="planet"></div>
      </div>
      <h2>No active projects.</h2>
      <p class="lede">{{template "start-hint" .Pages}}</p>
    </section>
{{- else}}
    <p class="count">{{len .Routes}} in orbit</p>
    <ul>
{{- range .Routes}}
      <li><a class="card" href="{{.URL}}">
        <span class="name">{{.Name}}</span>
        <span class="port"><code>:{{.Port}}</code></span>
        <span class="url">{{.URL}}</span>
        <span class="dir">{{.ProjectDir}}</span>
      </a></li>
{{- end}}
    </ul>
{{- end}}
  </div>
</main>
</body></html>
