<!DOCTYPE html>
<html><head><title>Astro Local Proxy</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 50px auto; padding: 0 20px; color: #333; }
h1 { color: #1a1a2e; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid #eee; }
th { background: #f8f9fa; font-weight: 600; }
code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; }
a { color: #0066cc; text-decoration: none; }
a:hover { text-decoration: underline; }
.empty { color: #666; font-style: italic; padding: 40px 0; text-align: center; }
</style></head><body>
<h1>Astro Local Proxy</h1>
{{- if not .Routes}}
<p class="empty">No active projects. Run <code>astro local start</code> in a project to get going.</p>
{{- else}}
<table><tr><th>Project</th><th>URL</th><th>Backend Port</th><th>Project Dir</th></tr>
{{- range .Routes}}
<tr><td>{{.Name}}</td><td><a href="{{.URL}}">{{.URL}}</a></td><td>{{.Port}}</td><td>{{.ProjectDir}}</td></tr>
{{- end}}
</table>
{{- end}}
</body></html>
