[project]
name = "regex-heavy"
# literal strings so the regexes below stay un-escaped
dependencies = ['apache-airflow-providers-common-sql']

[tool.astro]
airflow = '3.2'

[tool.astro.target.astro]
system-packages = ['libaio', 'unixodbc', 'msodbcsql18']

[tool.pytest.ini_options]
addopts = '-ra --strict-markers'
filterwarnings = [
    'ignore:.*distutils.*:DeprecationWarning',
    'error::airflow\.exceptions\.RemovedInAirflow4Warning',
]
