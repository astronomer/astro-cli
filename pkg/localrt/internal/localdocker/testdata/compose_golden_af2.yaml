x-common-env: &common-env
  AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth'
  AIRFLOW__CORE__EXECUTOR: 'LocalExecutor'
  AIRFLOW__CORE__FERNET_KEY: 'd6Vefz3G9U_ynXB3cr7y_Ak35tAHkEGAVxuz_B-jzWw='
  AIRFLOW__CORE__LOAD_EXAMPLES: 'True'
  AIRFLOW__CORE__SQL_ALCHEMY_CONN: 'postgresql://postgres:postgres@postgres:5432'
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: 'postgresql://postgres:postgres@postgres:5432'
  AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: '2'
  AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: '3'
  AIRFLOW__WEBSERVER__BASE_URL: 'http://localhost:8081'
  AIRFLOW__WEBSERVER__RBAC: 'True'
  AIRFLOW__WEBSERVER__SECRET_KEY: 'astro-demo-abc123'
  ASTRONOMER_ENVIRONMENT: 'local'
  MY_SECRET: 'it''s quoted'
  'SHELL_ONLY_TOKEN':

networks:
  airflow:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:
  postgres:
    image: docker.io/postgres:12.6
    restart: unless-stopped
    networks:
      - airflow
    labels:
      io.astronomer.docker: "true"
      io.astronomer.docker.cli: "true"
    ports:
      - 127.0.0.1:15432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  db-migration:
    depends_on:
      - postgres
    image: quay.io/astronomer/astro-runtime:12.9.0
    command:
      - 'bash'
      - '-c'
      - 'airflow db migrate && airflow sync-perm && airflow users create --role Admin --username admin --password admin --email admin@example.com --firstname admin --lastname user'
    networks:
      - airflow
    labels:
      io.astronomer.docker: "true"
      io.astronomer.docker.cli: "true"
      io.astronomer.docker.component: "airflow-db-migration"
    environment: *common-env

  scheduler:
    # Wait for the migration to finish, not just to start: a component that
    # opens the metadata database before the tables exist crash-loops, and
    # Astro Runtime's version-check plugin creates its own table on every
    # start, which collides when several components do it at once.
    depends_on:
      db-migration:
        condition: service_completed_successfully
    image: quay.io/astronomer/astro-runtime:12.9.0
    command:
      - 'airflow'
      - 'scheduler'
    restart: unless-stopped
    networks:
      - airflow
    user: astro
    labels:
      io.astronomer.docker: "true"
      io.astronomer.docker.cli: "true"
      io.astronomer.docker.component: "airflow-scheduler"
    environment: *common-env
    volumes:
      - /home/me/demo/dags:/usr/local/airflow/dags:z
      - /home/me/demo/include:/usr/local/airflow/include:z

  webserver:
    # Wait for the migration to finish, not just to start: a component that
    # opens the metadata database before the tables exist crash-loops, and
    # Astro Runtime's version-check plugin creates its own table on every
    # start, which collides when several components do it at once.
    depends_on:
      db-migration:
        condition: service_completed_successfully
    image: quay.io/astronomer/astro-runtime:12.9.0
    command:
      - 'airflow'
      - 'webserver'
    restart: unless-stopped
    networks:
      - airflow
    user: astro
    labels:
      io.astronomer.docker: "true"
      io.astronomer.docker.cli: "true"
      io.astronomer.docker.component: "airflow-webserver"
    environment: *common-env
    ports:
      - 127.0.0.1:8081:8080
    volumes:
      - /home/me/demo/dags:/usr/local/airflow/dags:z
      - /home/me/demo/include:/usr/local/airflow/include:z

  triggerer:
    # Wait for the migration to finish, not just to start: a component that
    # opens the metadata database before the tables exist crash-loops, and
    # Astro Runtime's version-check plugin creates its own table on every
    # start, which collides when several components do it at once.
    depends_on:
      db-migration:
        condition: service_completed_successfully
    image: quay.io/astronomer/astro-runtime:12.9.0
    command:
      - 'airflow'
      - 'triggerer'
    restart: unless-stopped
    networks:
      - airflow
    user: astro
    labels:
      io.astronomer.docker: "true"
      io.astronomer.docker.cli: "true"
      io.astronomer.docker.component: "airflow-triggerer"
    environment: *common-env
    volumes:
      - /home/me/demo/dags:/usr/local/airflow/dags:z
      - /home/me/demo/include:/usr/local/airflow/include:z
