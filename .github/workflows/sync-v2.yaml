name: Sync main into v2

# v2 takes every commit on main while both are live. When v2 falls behind, this
# keeps one PR open that merges main into v2. .github/scripts/sync-v2.sh does the
# work; its header lists the cases.
#
# The PR's head is a branch of its own, sync/main-into-v2, holding a merge commit
# of main into v2. It is never main itself: with main as the head, the PR's head
# SHA is main's tip, so the checks main's own CI already reported on that SHA
# would count for v2's required checks, and "Update branch" on the PR would merge
# v2 into main. The merge commit is a new SHA, so v2's CI runs on it.
#
# Nothing merges automatically. v2's layout and lint differ from main's, so a
# person reviews the PR, ports what needs porting onto the branch, and merges it
# with a merge commit.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-v2
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'astronomer/astro-cli'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # A push or PR made with GITHUB_TOKEN starts no workflows, so v2's required
      # checks would never run on the PR. A GitHub App token's pushes do start them.
      # The astro-cli-sync identity (astronomer/.github) trusts only this file on
      # main, with contents and pull_requests write.
      - name: Get token via Octo STS
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: sync-token
        with:
          scope: astronomer
          identity: astro-cli-sync

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.sync-token.outputs.token }}

      - name: Open or update the main -> v2 PR
        env:
          GH_TOKEN: ${{ steps.sync-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "octo-sts[bot]"
          git config user.email "157150467+octo-sts[bot]@users.noreply.github.com"
          .github/scripts/sync-v2.sh
