name: Nightly e2e

# Tiers 2 and 3 start a real Airflow — a database migration, a supervisor, an API
# server to wait for — so it runs here rather than on every pull request.
#
# A nightly nobody reads is worse than no test, so a failure opens an issue and
# a later pass closes it. GitHub's own signal for a scheduled workflow emails
# whoever last edited the cron line, which is nobody in particular.
#
# Two legs, each with an issue of its own, because they fail for different
# reasons and want different people:
#
#   pinned     tiers 0-3 at the resolution date pull requests use
#              (pinnedExcludeNewer in e2e/excludenewer_test.go). A failure is a
#              regression in this repository, or the flakiness that keeps tiers
#              2 and 3 off the pull-request path.
#   live-pypi  tiers 0-2 against live PyPI (ASTRO_E2E_EXCLUDE_NEWER=none). A
#              failure here and not in the pinned leg is an upstream release
#              breaking the suite — the kind of break the pin keeps off every
#              pull request, landing on this one run instead.
#
# live-pypi stops at tier 2 because tier 3 gains nothing from it: a docker-mode
# build installs inside the runtime image through its ONBUILD triggers, which
# never see UV_EXCLUDE_NEWER, so tier 3 resolves against live PyPI in both legs.

on:
  schedule:
    # 07:00 UTC, which is the small hours in US time zones: the run is finished
    # and the issue is already open by the time anyone looks.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # The skip check reads earlier runs of this workflow.
  actions: read

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: ${{ matrix.leg }}
    strategy:
      # Independent signals: an upstream break must not cancel the leg that
      # would say whether this repository also regressed.
      fail-fast: false
      matrix:
        include:
          - leg: pinned
            tier: 3
            # Empty takes the suite's own pinned date.
            exclude_newer: ''
            # Unchanged from before the legs split, so an issue already open
            # under it keeps collecting nights rather than being orphaned.
            issue_title: Nightly e2e (tiers 2-3) is failing
            issue_lead: >-
              Tier 2 or 3 of the e2e suite failed on the nightly run, at the
              resolution date pull requests use. Tier 2 starts a real Airflow
              and tier 3 starts one in Docker, so this is either a regression
              in start/stop, port allocation, stale-record cleaning, reset, or
              the docker image build and teardown — or the flakiness that keeps
              these tiers off the pull-request path. The run log says which.
          - leg: live-pypi
            tier: 2
            exclude_newer: none
            issue_title: Nightly e2e against live PyPI is failing
            issue_lead: >-
              The e2e suite failed on the nightly run resolving against live
              PyPI. If the pinned leg of the same run passed, a package
              published since pinnedExcludeNewer (e2e/excludenewer_test.go)
              breaks the suite. Pull requests are unaffected while the date
              holds; fix the break (a constraint in the scaffold, or a code
              change) before the weekly bump PR moves the date past it.
    env:
      ISSUE_TITLE: ${{ matrix.issue_title }}
    runs-on: ubuntu-latest
    # Measured at ~130s for all three tiers, so this is generous. It is here
    # because a cancelled job is neither failure() nor success(): without a
    # bound, a stalled uv download runs to GitHub's six-hour default and then
    # reports nothing at all, which is the one outcome this workflow is built
    # to prevent.
    # Above the suite's own 45m for tier 3, so that an overrun is go test's
    # panic — which names the test and dumps its goroutines — rather than
    # GitHub cancelling the job. A cancelled job is neither failure() nor
    # success(), so both steps below would be skipped and the nightly would
    # report nothing at all.
    timeout-minutes: 55
    steps:
      # A scheduled night skips the pinned leg when the latest pinned result
      # at this exact commit is a pass. Its inputs are this repository and
      # the pinned date, so rerunning it on an unchanged trunk mostly
      # re-measures flakiness. That covers quiet days, weekends mostly.
      #
      # live-pypi never skips: what it watches is PyPI, which moves whether
      # or not trunk does. workflow_dispatch never skips either, because a
      # hand-run is somebody asking for one.
      #
      # The latest result, not any pass: a failure after a pass at the same
      # commit runs again, so an open issue keeps collecting nights and is
      # closed by a real pass, never by a skip. A skipped night reports
      # success, which the next night then reads as a pass, and that chain
      # always starts from a real one.
      #
      # This is a step gating the rest rather than a job removing the leg
      # from the matrix, because a matrix cannot drop a leg it declares under
      # include: exclude is applied first, and include then adds the entry
      # back as a new leg of its own.
      - id: gate
        name: Skip if trunk has not moved since the pinned leg passed
        if: ${{ matrix.leg == 'pinned' && github.event_name == 'schedule' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Named by file, so renaming the workflow does not quietly turn
          # off the skip. Newest first. This run is still in progress, so
          # status=completed leaves it out. An API error lists nothing, and
          # the leg runs: a skip has to be proven, never assumed.
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly-e2e.yaml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=50" \
            --jq '.workflow_runs[].id' || true)
          for id in $runs; do
            # A cancelled or absent pinned job says nothing either way, so
            # the loop moves on to the run before it.
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
              --jq 'first(.jobs[] | select(.name == "pinned" and (.conclusion == "success" or .conclusion == "failure")) | .conclusion) // empty' || true)
            case "$result" in
              success)
                echo "The pinned leg passed at $GITHUB_SHA in run $id and trunk has not moved since; skipping it tonight."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0 ;;
              failure)
                echo "The pinned leg last failed at $GITHUB_SHA (run $id); running it again."
                exit 0 ;;
            esac
          done
          echo "No pinned result yet at $GITHUB_SHA; running it."

      # Tier 3 pulls two runtime bases (the scaffold's Airflow 3 and the
      # Airflow 2 case's) and builds on each, and the restored Go cache is
      # another ~1.6 GB compressed. Together they fill the ~14 GB a hosted
      # runner leaves free: even passing nights went down to 59 MB, and
      # failing ones end in "no space left on device" from layer
      # registration. So this step deletes toolchains the image preinstalls
      # that this job never uses. It runs first, before setup-go writes
      # into the hostedtoolcache this step only partly removes.
      # rm -rf rather than a third-party action, for the reason the issue
      # steps use gh: one fewer thing to pin by SHA.
      - name: Free the runner's disk for the Docker tier
        if: ${{ matrix.tier >= 3 && steps.gate.outputs.skip != 'true' }}
        shell: bash
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules
          docker image prune --all --force > /dev/null
          df -h /

      # Every step from here to the tests carries the same guard: Actions
      # has no way to end a job early, only to skip its steps.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: ${{ steps.gate.outputs.skip != 'true' }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: ${{ steps.gate.outputs.skip != 'true' }}
        with:
          go-version-file: go.mod
          cache: false

      - id: go-env
        if: ${{ steps.gate.outputs.skip != 'true' }}
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # Restore only, never save. The trunk push is the single writer of these
      # caches (see ci.yaml), and a nightly that also saved would race it for
      # the same key and win by being later, with objects built from whatever
      # trunk looked like hours ago.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ steps.gate.outputs.skip != 'true' }}
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: go-test-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            go-test-${{ runner.os }}-

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: ${{ steps.gate.outputs.skip != 'true' }}
        with:
          enable-cache: false

      - name: Point uv's cache at a path this job restores
        if: ${{ steps.gate.outputs.skip != 'true' }}
        shell: bash
        run: echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ steps.gate.outputs.skip != 'true' }}
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('pkg/scaffold/scaffold.go', 'e2e/excludenewer_test.go') }}
          restore-keys: uv-${{ runner.os }}-

      # Every tier, not only the top one: the tiers below run per pull request,
      # but running them here too costs seconds and catches the interactions
      # between them that a tier on its own cannot.
      #
      # Tier 3 is here rather than on the PR path because of what it pulls: the
      # Airflow runtime image is 1.34 GB, and a runner starts with none of it.
      # That is a nightly's kind of minute, not a pull request's — and the cases
      # themselves run in about forty seconds once the image is down.
      #
      # The pinned leg leaves ASTRO_E2E_EXCLUDE_NEWER empty, which the suite
      # reads as its own date; see the matrix above.
      - name: Run e2e tests (tiers 0 through ${{ matrix.tier }})
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          ASTRO_E2E_EXCLUDE_NEWER: ${{ matrix.exclude_newer }}
        run: make test-e2e ASTRO_E2E_MAX_TIER=${{ matrix.tier }}

      # The headroom left at the end, printed every night, so a margin
      # shrinking toward zero shows up in the log before it causes a failure.
      - name: Report disk headroom
        if: ${{ always() && steps.gate.outputs.skip != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          df -h /
          docker system df || true

      # gh rather than a scripting action, because the runner already has it
      # and this repo pins every action by SHA — one fewer thing to pin and
      # keep current.
      # Matched by exact title rather than a label, so this needs no label to
      # exist first — a workflow that depends on repository setup nobody
      # remembers doing is a workflow that silently stops reporting.
      - name: Report the failure where someone will see it
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Through the environment rather than spliced into the script, for
          # the reason the title goes to jq that way below.
          ISSUE_LEAD: ${{ matrix.issue_lead }}
          REPRODUCE: ${{ matrix.exclude_newer && format('ASTRO_E2E_EXCLUDE_NEWER={0} ', matrix.exclude_newer) || '' }}make test-e2e ASTRO_E2E_MAX_TIER=${{ matrix.tier }}
        run: |
          set -uo pipefail
          # jq reads the title from the environment rather than having it
          # spliced into the program text: a title with a quote in it would
          # otherwise make an invalid program, jq would error, and the step
          # would file a fresh duplicate issue every night while never finding
          # the one to close. The search narrows server-side so the answer does
          # not depend on how many other issues happen to be open.
          find_issue() {
            gh issue list --state open --search "in:title $ISSUE_TITLE" \
              --json number,title \
              --jq 'first(.[] | select(.title == env.ISSUE_TITLE) | .number) // empty'
          }
          existing=$(find_issue)
          if [ -n "$existing" ]; then
            # One issue per outage rather than one per night.
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
            exit 0
          fi
          # printf rather than a quoted block, so the body carries no leading
          # indentation — four spaces would render the whole issue as code.
          body=$(printf '%s\n' \
            "$ISSUE_LEAD" \
            "" \
            "$RUN_URL" \
            "" \
            "Reproduce locally:" \
            "" \
            '```' \
            "$REPRODUCE" \
            '```' \
            "" \
            "This issue closes itself when a nightly passes again.")
          gh issue create --title "$ISSUE_TITLE" --body "$body"

      # Scheduled runs only, both here and above. workflow_dispatch is how
      # somebody tries the suite by hand, often while an outage is open, and a
      # hand-run that happens to pass would otherwise close the outage and lose
      # the thread the next nightly would have added to.
      - name: Close the failure issue once it passes
        # Not on a skipped night, which proves nothing new.
        if: ${{ success() && github.event_name == 'schedule' && steps.gate.outputs.skip != 'true' }}
        # A red nightly with a green test step and no issue is the worst
        # outcome available, so a flaky gh call must not fail the job.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          find_issue() {
            gh issue list --state open --search "in:title $ISSUE_TITLE" \
              --json number,title \
              --jq 'first(.[] | select(.title == env.ISSUE_TITLE) | .number) // empty'
          }
          existing=$(find_issue)
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Passing again: $RUN_URL"
          fi
