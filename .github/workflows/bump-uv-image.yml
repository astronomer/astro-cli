name: Bump install-stage uv image

# Moves the uv image every image build's install stage copies uv from (the
# one-line uv-image.txt the CLI embeds as UVImage) to the newest astral-sh/uv
# release past the supply-chain cooldown: 7 days, 14 for a major bump (a minor
# one while uv is 0.x), the policy Astro Desktop's bump-uv.yml follows.
# scripts/bump-uv-image.sh picks the release and pins its multi-arch index by
# digest.
#
# The run checks the helper's tests that run real `uv lock` and `uv export`
# against the new release before opening the PR; the PR's own CI is the rest
# of the review. `version` is the security fast-track: it skips the cooldown.
#
# Token handling is bump-default-airflow.yml's: `secrets.BUMP_PR_TOKEN` when set,
# the default `GITHUB_TOKEN` otherwise. A PR opened by the default token does
# NOT trigger ci.yaml, so set BUMP_PR_TOKEN or close and reopen the PR to start
# its checks.

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Force a uv release, such as 0.13.6 (security fast-track: skips the cooldown). Leave blank for normal discovery.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-uv-image
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: v2
          token: ${{ secrets.BUMP_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pick the release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_VERSION: ${{ inputs.version }}
        run: |
          pin="$(scripts/bump-uv-image.sh)"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -E 's/^[^:]+:([^@]+)@.*/\1/' <<<"$pin")" >> "$GITHUB_OUTPUT"
          if [ -n "$pin" ]; then echo "uv image now $pin"; else echo "uv image already current"; fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.bump.outputs.pin != ''
        with:
          go-version-file: go.mod

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.bump.outputs.pin != ''
        with:
          version: ${{ steps.bump.outputs.version }}
          enable-cache: false

      - name: Run the install helper's tests on the new uv
        if: steps.bump.outputs.pin != ''
        run: |
          uv --version
          dir="$(dirname "$(git ls-files '*/uv-image.txt')")"
          (cd "$dir" && go test -count=1 ./...)

      - name: Open the PR
        if: steps.bump.outputs.pin != ''
        env:
          GH_TOKEN: ${{ secrets.BUMP_PR_TOKEN || secrets.GITHUB_TOKEN }}
          PIN: ${{ steps.bump.outputs.pin }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="bump-uv-image-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists; its PR is the one to review"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Copy uv $VERSION into the install stage"
          git push origin "$branch"
          {
            echo "Moves the uv image every install stage copies uv from to \`$PIN\`: the newest astral-sh/uv release that has aged past our supply-chain cooldown (7 days, 14 for a major or 0.x-minor bump), pinned by its multi-arch index digest by \`scripts/bump-uv-image.sh\`."
            echo
            echo "The install helper's tests already passed against uv $VERSION in the run that opened this PR. Its own CI is the rest of the review: green, merge it."
            echo
            echo "Opened by \`.github/workflows/bump-uv-image.yml\`."
          } > pr-body.md
          gh pr create --repo "$GITHUB_REPOSITORY" --base v2 --head "$branch" \
            --title "Copy uv $VERSION into the install stage" \
            --body-file pr-body.md
          rm -f pr-body.md
