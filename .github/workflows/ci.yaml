name: CI

on:
  push:
    branches:
      - main
      - 'v[0-9]+'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Cache prek tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/prek
          key: prek-v1-${{ hashFiles('prek.toml') }}

      - name: Install prek
        run: |
          PREK_VERSION="0.3.8"
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)  SHA256="732cfb03960e6dfd5df2cb67906797aa8831750ef3a6f6340ec2b90ee8b7a59f" ;;
            aarch64) SHA256="b88d96aef4ea84999d12958c390611d3a26194ee57225fe2ff15a9855e3a71bf" ;;
            *) echo "Unsupported arch: $ARCH" && exit 1 ;;
          esac
          curl -fsSL "https://github.com/j178/prek/releases/download/v${PREK_VERSION}/prek-${ARCH}-unknown-linux-musl.tar.gz" \
            -o /tmp/prek.tar.gz
          echo "${SHA256}  /tmp/prek.tar.gz" | sha256sum -c
          mkdir -p ~/bin
          tar -xz --strip-components=1 -C ~/bin -f /tmp/prek.tar.gz
          echo "$HOME/bin" >> $GITHUB_PATH
          ~/bin/prek --version

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code

      - name: Run golangci-lint
        run: make lint-go

      - name: Run deadcode
        run: make lint-deadcode

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run unit tests
        env:
          HOUSTON_HOST: houston
        run: make test

      - name: Test the installer's version resolution
        run: make test-installer

      - name: Drop generated code from the coverage profile
        run: |
          grep -v -E '/(api\.gen\.go|mocks/[^:]*):' coverage.txt > coverage.filtered.txt
          mv coverage.filtered.txt coverage.txt

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2
        continue-on-error: true
        with:
          file: coverage.txt
          format: golang

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # bash, not the default pwsh: PowerShell splits a native argument at a
      # dot, so `-test.v` reached go as `-test .v`, `./...` never became the
      # package list, and the step built everything, tested nothing and passed.
      #
      # The check after it guards against that coming back in any form: it
      # fails the step, naming them, when a package `go list` names has no
      # result line (ok, FAIL, "no test files" or a bare coverage line).
      - name: Run unit tests
        shell: bash
        run: |
          # Actions already runs bash with pipefail; set it here too so the
          # exit status below is go test's, not tee's, however this is run.
          set -o pipefail
          status=0
          log="${RUNNER_TEMP}/go-test.log"
          go test -count=1 -cover -covermode=atomic ./... 2>&1 | tee "${log}" || status=$?
          mod='github\.com/astronomer/astro-cli(/[^[:space:]]*)?'
          go list ./... | LC_ALL=C sort -u > "${RUNNER_TEMP}/listed.txt"
          sed -nE \
            -e "s#^(ok|FAIL|\?)[[:space:]]+(${mod})([[:space:]].*)?\$#\2#p" \
            -e "s#^[[:space:]]+(${mod})[[:space:]]+coverage:.*#\1#p" \
            "${log}" | LC_ALL=C sort -u > "${RUNNER_TEMP}/reported.txt" || true
          missing=$(LC_ALL=C comm -23 "${RUNNER_TEMP}/listed.txt" "${RUNNER_TEMP}/reported.txt")
          echo "packages listed: $(wc -l < "${RUNNER_TEMP}/listed.txt"), reported: $(wc -l < "${RUNNER_TEMP}/reported.txt")"
          if [ -n "${missing}" ]; then
            echo "::error::go test reported no result for: $(tr '\n' ' ' <<< "${missing}")"
            exit 1
          fi
          exit "${status}"

  detect-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            src:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'integration-test/**'

  integration-test:
    needs: [lint, test, test-windows, detect-changes]
    if: >-
      always() &&
      !failure() &&
      !cancelled() &&
      (
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && needs.detect-changes.outputs.src == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install poetry
        run: pip install poetry

      - name: Build astro cli
        run: make build

      - name: Run integration tests
        run: |
          python -m venv penv
          . penv/bin/activate
          cd integration-test && poetry install --no-root
          pytest -x -s -v dev_test.py
