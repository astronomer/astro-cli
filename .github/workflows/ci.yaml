name: CI

on:
  push:
    branches:
      - v2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Cache prek tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/prek
          key: prek-v1-${{ hashFiles('prek.toml') }}

      - name: Install prek
        run: |
          PREK_VERSION="0.3.8"
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)  SHA256="732cfb03960e6dfd5df2cb67906797aa8831750ef3a6f6340ec2b90ee8b7a59f" ;;
            aarch64) SHA256="b88d96aef4ea84999d12958c390611d3a26194ee57225fe2ff15a9855e3a71bf" ;;
            *) echo "Unsupported arch: $ARCH" && exit 1 ;;
          esac
          curl -fsSL "https://github.com/j178/prek/releases/download/v${PREK_VERSION}/prek-${ARCH}-unknown-linux-musl.tar.gz" \
            -o /tmp/prek.tar.gz
          echo "${SHA256}  /tmp/prek.tar.gz" | sha256sum -c
          mkdir -p ~/bin
          tar -xz --strip-components=1 -C ~/bin -f /tmp/prek.tar.gz
          echo "$HOME/bin" >> $GITHUB_PATH
          ~/bin/prek --version

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code

      - name: Run golangci-lint
        run: make lint

      - name: Run golangci-lint on the sub-modules
        run: make lint-submodules

      - name: Run golangci-lint on the e2e module
        run: make lint-e2e

      # Exported functions nothing reaches from main(), which `unused` cannot
      # see. Linux and Windows only: see scripts/deadcode.sh for why not darwin.
      - name: Check for dead code
        run: make deadcode

  # This runner is ubuntu, so the lint job above compiles no _windows.go or
  # _darwin.go file and therefore checks none of them. This one does.
  #
  # A job of its own because it was the longest step in lint and shares nothing
  # with the rest of it — it calls golangci-lint directly rather than through
  # prek, and it needs no prek install. In sequence it made lint, rather than
  # test-windows, the whole run's critical path; in parallel it costs a runner
  # instead of five minutes of everyone's time.
  #
  # Its own cache, for the reason `test` has one: setup-go's key is shared by
  # every Linux job here and only the first to finish writes it. What this job
  # builds is windows and darwin objects, which is precisely what the lint job
  # must not find in place of its own — so it takes itself out of that key and
  # keeps one where cross-platform objects are the point. Same restore-always,
  # save-on-trunk shape as `test`, and the same reason for testing the event
  # rather than a branch name.
  lint-goos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - id: go-env
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: go-lint-goos-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-lint-goos-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            go-lint-goos-${{ runner.os }}-

      - name: Run golangci-lint for the platforms this runner does not compile
        run: make lint-goos

      # Runs even when the lint above failed: the objects were compiled by the
      # time this is reached and are no less valid for a finding having been
      # reported against them.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && github.event_name == 'push' }}
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: go-lint-goos-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # setup-go's own cache key is the same for every Linux job here, and only
      # the first job to finish writes it — that is `lint`, whose build cache
      # holds no -race or -cover objects. This job then rebuilt the whole tree
      # from cold every run. Keep a cache of its own instead.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      # Paths from the toolchain rather than written out, so this block is the
      # same on every runner: GOCACHE is ~/.cache/go-build on Linux and
      # AppData\Local\go-build on Windows.
      - id: go-env
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # Restore on every run; save only on a push to trunk.
      #
      # The commit belongs in the key because actions/cache will not overwrite
      # one that already exists. Keyed on go.sum alone the cache freezes at
      # whatever the first run to populate it built, and anything a later step
      # needs that the frozen cache does not hold is recompiled on every run
      # after: the e2e step builds the CLI without -race while the unit tests
      # reuse -race objects, so on this runner the difference is 228s against
      # 7s for the e2e step and 131s against 67s for the tests.
      #
      # A key carrying the commit also saves on every commit, and saving costs
      # 28s here and 507s on Windows — more than the recompile it avoids.
      # Restoring is the cheap half, so every run restores and only a trunk
      # push pays to refresh what the next run reads.
      #
      # The saves below test `github.event_name == 'push'` rather than a branch
      # name. The `on: push` trigger already decides which branches build, so
      # every push event reaching this workflow is a push to trunk by
      # construction, and a branch named a second place is free to disagree
      # with the trigger. It also survives v2 being promoted: the trigger is
      # then the only edit, and a branch added there is covered rather than
      # silently skipped. `github.event.repository.default_branch` is
      # name-agnostic too, but it can disagree with the trigger; this cannot.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: go-test-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            go-test-${{ runner.os }}-

      - name: Run unit tests
        env:
          HOUSTON_HOST: houston
        run: make test

      - name: Run sub-module unit tests
        run: bash scripts/test-submodules.sh

      # The e2e suite rides in this job rather than one of its own so that it
      # shares the Go build cache above; a job of its own would hold a cache of
      # its own and build the tree from cold.
      #
      # Tier 1 builds a real Airflow environment, so it needs uv — and it needs
      # uv's downloads to survive between runs: ~220 MB per environment, which
      # is the difference between this tier taking seconds and taking minutes.
      # The suite shares that cache deliberately rather than isolating it; see
      # uvCache in e2e/harness_test.go.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # The suite is told the cache directory below, so the action's own
          # caching would be a second copy of the same thing under a different
          # key.
          enable-cache: false

      # One place the uv cache directory is written down: exported here, so the
      # e2e suite reads it from the environment and the restore and save steps
      # below use it as their path. Guessing it in three places is how they
      # come to disagree.
      #
      # A step rather than the job's `env:`, because that cannot see the runner
      # context — and absolute rather than `~/...`, because the suite hands the
      # value to uv as an environment variable and nothing expands a tilde for
      # a process the way a shell does for a command.
      - name: Point uv's cache at a path this job restores
        shell: bash
        run: echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"

      # Restore every run, save only on a trunk push — the same split as the Go
      # cache above, for the same two reasons: a cache saved on a pull request
      # is scoped to that request and helps nobody else, and uploading ~220 MB
      # of wheels is not free.
      #
      # UV_CACHE_DIR is set rather than guessed. The suite falls back to
      # os.UserCacheDir(), which agrees with ~/.cache/uv only while
      # XDG_CACHE_HOME is unset on the runner — and if a runner image ever set
      # it, this would cache an empty directory and every tier-1 case would
      # download from cold with no failing step to say so.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          # Keyed on the file that pins the Airflow tier 1 installs, so a bump
          # fetches rather than reusing wheels for the old one.
          key: uv-${{ runner.os }}-${{ hashFiles('pkg/scaffold/scaffold.go') }}
          restore-keys: uv-${{ runner.os }}-

      # Both tiers in one run. ASTRO_E2E_MAX_TIER is a ceiling, not a
      # selection, so a separate tier-0 step before this one ran every tier-0
      # case twice. That tier 0 needs no uv is still proved, by the Windows job
      # below: it sets up none and runs tier 0 alone.
      - name: Run e2e tests (tiers 0 and 1)
        run: make test-e2e ASTRO_E2E_MAX_TIER=1

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && github.event_name == 'push' }}
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('pkg/scaffold/scaffold.go') }}

      # Last, so it holds everything the steps above built, including the
      # non-race objects the e2e binary needs.
      #
      # Runs even when a step above failed. The objects were already compiled
      # by the time this is reached, and they are just as valid after a test
      # failure — while discarding them means every pull request opened after a
      # red trunk push restores the run before it and recompiles the difference,
      # until the next green one.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && github.event_name == 'push' }}
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: go-test-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2
        continue-on-error: true
        with:
          file: coverage.txt
          format: golang

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # cache: false and a cache of this job's own, for the reasons written out
      # in the `test` job above. setup-go's built-in cache has the same
      # write-once key problem, and here it was the only cache in the job.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - id: go-env
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # Restore every run, save only on a trunk push — see the test job above
      # for why, and for the numbers. Saving here costs 507s, against the 306s
      # of recompiling it avoids, so a key that rotated on every commit would
      # be slower than the bug it fixed.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: go-test-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            go-test-${{ runner.os }}-

      - name: Run unit tests
        env:
          GORACE: atexit_sleep_ms=0 # see the `test` target in the Makefile
        run: go test -count=1 -race -shuffle=on -timeout=15m -cover -covermode=atomic -test.v ./...

      # The gap this closes: the root module's `./...` does not descend into
      # pkg/*, so every sub-module went untested on Windows — including the
      # GOOS-specific filepath and keyring code most likely to behave
      # differently there. bash, not make: the runner has Git Bash and no GNU
      # make.
      - name: Run sub-module unit tests
        shell: bash
        run: bash scripts/test-submodules.sh

      # The CLI-level tests ran on Linux only until now, which left the
      # scaffolding and path handling most likely to differ here unexercised
      # end to end. bash, not make: the runner has Git Bash and no GNU make.
      - name: Run e2e tests (tier 0)
        shell: bash
        run: bash scripts/test-e2e.sh

      # Last, so it holds the non-race objects the e2e binary needs alongside
      # the -race ones the tests above built. Runs after a failure too, for the
      # reason given on the same step in the `test` job — and it matters more
      # here, where saving costs 507s and the recompile it avoids costs 306s.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && github.event_name == 'push' }}
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: go-test-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
