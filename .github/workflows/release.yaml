name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-nightly.[0-9]*'

env:
  STABLE_MAJOR: 1

permissions:
  contents: write
  pull-requests: write
  id-token: write  # Required for Octo STS OIDC token exchange

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      type: ${{ steps.parse.outputs.type }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      major: ${{ steps.parse.outputs.major }}
      stable: ${{ steps.parse.outputs.stable }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "$TAG" =~ -nightly\. ]]; then
            TYPE="nightly"
            VERSION="${TAG#v}"
          elif [[ "$TAG" =~ -rc\. ]]; then
            TYPE="rc"
            VERSION="${TAG#v}"
            VERSION="${VERSION%-rc.*}"
          else
            TYPE="ga"
            VERSION="${TAG#v}"
          fi

          MAJOR="${VERSION%%.*}"

          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "stable=$([ "$MAJOR" = "$STABLE_MAJOR" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Parsed — Tag: $TAG | Type: $TYPE | Version: $VERSION | Stable major: $STABLE_MAJOR"

  release:
    needs: detect
    runs-on: macos-15
    # Release signing credentials (Apple today, Azure for Windows next) are environment
    # secrets here, not repository secrets, so only jobs deploying to this environment
    # (release tags, by its deployment policy) can read them; a workflow pushed to any
    # other branch cannot.
    environment: release-signing
    # A cold-cache build takes up to ~30 minutes. Each darwin binary's signing hook then
    # waits on Apple's notarization for up to 20 minutes; the two run in parallel, but a
    # retry after a failed submission can add another wait.
    timeout-minutes: 90
    outputs:
      # "true" when the published darwin or Windows binaries failed signature
      # verification, so the announcement jobs below hold back.
      signature_failed: ${{ steps.verify-signatures.outputs.failed == 'true' || steps.verify-windows-signatures.outputs.failed == 'true' }}
    env:
      # Signing is required, and checked, only for releases of this repository. Forks
      # and local snapshots build unsigned.
      OFFICIAL_RELEASE: ${{ github.repository == 'astronomer/astro-cli' }}
      # Public (it's in every binary we sign), so not a secret: a fixed expectation that
      # whoever can edit the signing secrets can't change.
      APPLE_TEAM_ID: XM6XZGXXH8
      # Azure Artifact Signing account and certificate profile for Windows (Authenticode)
      # signing; the publisher name comes from the identity validated for this profile.
      WINDOWS_SIGNING_ENDPOINT: eus.codesigning.azure.net
      WINDOWS_SIGNING_ACCOUNT: orbitersigner
      WINDOWS_SIGNING_PROFILE: Orbiter-Studio
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        id: setup-go
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/go-build
          key: release-go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ steps.source.outputs.sha }}
          restore-keys: |
            release-go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}-

      - name: Find previous GA tag for changelog
        id: prev-tag
        run: |
          # All release types (nightly/RC/GA) compare against the last GA for changelog continuity.
          PREV_GA=$(make prev-ga-tag MAJOR="${{ needs.detect.outputs.major }}" EXCLUDE="${{ needs.detect.outputs.tag }}")
          echo "tag=$PREV_GA" >> "$GITHUB_OUTPUT"
          echo "Previous GA tag for changelog: $PREV_GA"

      - name: Get Homebrew token via Octo STS
        if: needs.detect.outputs.type == 'ga' && needs.detect.outputs.stable == 'true'
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: homebrew-token
        with:
          scope: astronomer
          identity: astro-cli-homebrew

      - name: Stamp the installer with this release's version
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -e
          sed "s/^LATEST_VERSION=.*/LATEST_VERSION=${TAG}/" godownloader.sh > install.sh
          chmod +x install.sh
          if ! grep -qx "LATEST_VERSION=${TAG}" install.sh; then
            echo "::error::install.sh was not stamped with ${TAG}. Did the constant in godownloader.sh get renamed?"
            exit 1
          fi
          echo "Stamped install.sh with ${TAG}"

      # goreleaser's signing hooks do nothing without signing set up, so local snapshots and
      # forks still build. An official release must not ship unsigned: fail here, before
      # anything is built or published, when a signing secret or variable is missing or
      # misnamed.
      - name: Require release signing secrets
        if: env.OFFICIAL_RELEASE == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          # Not secret: the Azure app that signs Windows binaries logs in through GitHub
          # OIDC, so these only name it.
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_ISSUER_ID APPLE_API_KEY_ID APPLE_API_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ${name} is not set in the release-signing environment; refusing to release unsigned macOS binaries."
              missing=1
            fi
          done
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Variable ${name} is not set in the release-signing environment; refusing to release unsigned Windows binaries."
              missing=1
            fi
          done
          exit "$missing"

      # Also before anything is built: import the certificate into a keychain for this job
      # and require an in-date Developer ID Application identity for our team, not just any
      # certificate that happens to be in the secret. Exports MACOS_SIGN_KEYCHAIN,
      # MACOS_SIGN_IDENTITY and MACOS_NOTARY_KEY_PATH for goreleaser's signing hook.
      - name: Set up macOS signing
        if: env.OFFICIAL_RELEASE == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: scripts/release/setup-macos-signing.sh

      # Windows signing logs in to Azure with this job's GitHub OIDC token (subject
      # repo:astronomer/astro-cli:environment:release-signing); no Azure secret is stored.
      - name: Log in to Azure for Windows signing
        if: env.OFFICIAL_RELEASE == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Set up Java for jsign
        if: env.OFFICIAL_RELEASE == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      # Before anything is built: pinned jsign, osslsigncode for verification, and proof
      # that an Artifact Signing token can be issued. Exports JSIGN_JAR and
      # WINDOWS_SIGNING_READY for goreleaser's Windows signing hook.
      - name: Set up Windows signing
        if: env.OFFICIAL_RELEASE == 'true'
        run: scripts/release/setup-windows-signing.sh

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.15.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.homebrew-token.outputs.token }}
          GORELEASER_CURRENT_TAG: ${{ needs.detect.outputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.prev-tag.outputs.tag }}
          # For the darwin build's signing hook (scripts/release/sign-macos-binary.sh), with
          # the keychain, identity and key path that "Set up macOS signing" exported. It
          # signs and notarizes each binary before anything is archived or published, and
          # any failure there, an Apple rejection included, stops the release.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      # The signing hook already checked each binary before goreleaser archived it. This is
      # a second line on what was actually packaged: if anything after the hook replaced or
      # stripped a signature, the run fails and its signature_failed output holds back the
      # announcement jobs below. goreleaser has published by now, so it can't stop the
      # release itself.
      - name: Verify macOS binaries are signed by Astronomer
        id: verify-signatures
        if: env.OFFICIAL_RELEASE == 'true'
        run: |
          shopt -s nullglob
          scripts/release/verify-macos-signatures.sh dist/darwin-build_darwin_*/astro

      # Same second line for Windows: signer "Astronomer, Inc.", chain and timestamp on
      # what was packaged.
      - name: Verify Windows binaries are signed by Astronomer
        id: verify-windows-signatures
        if: env.OFFICIAL_RELEASE == 'true'
        run: |
          shopt -s nullglob
          scripts/release/verify-windows-signatures.sh dist/windows-build_windows_*/astro.exe

      - name: Remove the signing keychain and notary key
        if: always()
        run: scripts/release/cleanup-macos-signing.sh

  # install.astronomer.io fetches godownloader.sh from main, so this job keeps
  # that path current. Pinned installs use the install.sh release asset instead,
  # which carries its own version and does not depend on the PR this job opens.
  update-godownloader:
    needs: [detect, release]
    if: always() && !cancelled() && needs.detect.outputs.type == 'ga' && needs.detect.outputs.stable == 'true' && needs.release.result != 'skipped' && needs.release.outputs.signature_failed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.detect.outputs.tag }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::GitHub release $TAG does not exist. Skipping godownloader update."
            exit 1
          fi
          echo "Release $TAG confirmed."

      - name: Get token via Octo STS
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: godownloader-token
        with:
          scope: astronomer
          identity: astro-cli-release

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          token: ${{ steps.godownloader-token.outputs.token }}

      - name: Update LATEST_VERSION in godownloader.sh
        run: |
          TAG="v${{ needs.detect.outputs.version }}"
          sed -i "s/^LATEST_VERSION=.*/LATEST_VERSION=${TAG}/" godownloader.sh

      - name: Create PR
        env:
          GH_TOKEN: ${{ steps.godownloader-token.outputs.token }}
        run: |
          TAG="v${{ needs.detect.outputs.version }}"
          BRANCH="chore/update-godownloader-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add godownloader.sh
          git commit -m "chore: update godownloader to ${TAG}"
          git push origin "${BRANCH}"
          PR_BODY="Automated PR to update \`LATEST_VERSION\` in \`godownloader.sh\` to \`${TAG}\`."
          PR_BODY+=$'\n\n'"Triggered by release [${TAG}](https://github.com/${{ github.repository }}/releases/tag/${TAG})."
          gh pr create \
            --base main \
            --title "CLI Release: update godownloader to ${TAG}" \
            --body "$PR_BODY"

  update-winget:
    needs: [detect, release]
    if: always() && !cancelled() && needs.detect.outputs.type == 'ga' && needs.detect.outputs.stable == 'true' && needs.release.result != 'skipped' && needs.release.outputs.signature_failed != 'true'
    runs-on: windows-latest
    steps:
      - name: Verify GitHub release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.detect.outputs.tag }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::GitHub release $TAG does not exist. Skipping winget update."
            exit 1
          fi
          echo "Release $TAG confirmed."

      - name: Get Winget token via Octo STS
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: winget-token
        with:
          scope: astronomer
          identity: astro-cli-winget

      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: Astronomer.Astro
          version: ${{ needs.detect.outputs.version }}
          release-tag: ${{ needs.detect.outputs.tag }}
          installers-regex: '\.exe$'
          token: ${{ secrets.WINGET_PAT }}

  cleanup-nightlies:
    needs: [detect, release]
    if: needs.detect.outputs.type == 'nightly'
    runs-on: ubuntu-latest
    steps:
      - name: Delete old nightly releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Keep the 5 newest nightlies of each major; list the rest
          STALE_TAGS=$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("-nightly\\.")) ] | group_by(.tagName | capture("^v(?<major>[0-9]+)").major) | map(sort_by(.createdAt) | reverse | .[5:]) | .[][].tagName')

          COUNT=0
          for TAG in $STALE_TAGS; do
            COUNT=$((COUNT + 1))
            echo "Deleting release and tag: $TAG"
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag
          done

          echo "Nightly cleanup complete. Kept the 5 most recent per major, deleted $COUNT old nightlies."

  notify:
    needs: [detect, release, update-godownloader, update-winget]
    if: always() && !cancelled() && needs.detect.outputs.type == 'ga' && needs.release.result != 'skipped' && needs.release.outputs.signature_failed != 'true'
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Verify GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.detect.outputs.tag }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::GitHub release $TAG does not exist. Skipping notification."
            exit 1
          fi
          echo "Release $TAG confirmed."

      - name: Post release summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.detect.outputs.version }}"

          RELEASE_STATUS="${{ needs.release.result }}"
          GODOWNLOADER_STATUS="${{ needs.update-godownloader.result }}"
          WINGET_STATUS="${{ needs.update-winget.result }}"

          SUMMARY="## Post-Release Automation Summary"$'\n\n'
          SUMMARY+="| Task | Status |"$'\n'
          SUMMARY+="|------|--------|"$'\n'
          SUMMARY+="| GoReleaser (binaries + Homebrew PR) | ${RELEASE_STATUS} |"$'\n'
          SUMMARY+="| Godownloader PR | ${GODOWNLOADER_STATUS} |"$'\n'
          SUMMARY+="| Winget PR | ${WINGET_STATUS} |"

          # Get the release ID by tag, then append the summary to the release body
          RELEASE_ID=$(gh api "/repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.id' 2>/dev/null) || true
          if [ -n "$RELEASE_ID" ]; then
            EXISTING_BODY=$(gh api "/repos/${{ github.repository }}/releases/${RELEASE_ID}" --jq '.body // ""')
            UPDATED_BODY="${EXISTING_BODY}"$'\n\n'"${SUMMARY}"
            gh api \
              --method PATCH \
              "/repos/${{ github.repository }}/releases/${RELEASE_ID}" \
              -f body="${UPDATED_BODY}" || true
          fi

      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          TAG="v${{ needs.detect.outputs.version }}"
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{\"text\":\"Astro CLI ${TAG} has been released: https://github.com/${{ github.repository }}/releases/tag/${TAG}\"}"
