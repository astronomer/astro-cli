version: "2"
run:
  timeout: 3m
linters:
  default: none
  enable:
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - forbidigo
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - mnd
    - nakedret
    - nolintlint
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    errcheck:
      # Flag `_ = f()` too, not just unchecked returns. The exclusions below
      # cover the writes that genuinely cannot fail in a way we can act on.
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprintf
        - fmt.Fprintln
    forbidigo:
      forbid:
        - pattern: '^fmt\.Print(f|ln)?$'
        - pattern: '^os\.Exit$'
        - pattern: '^log\.(Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$'
      analyze-types: true
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
      ignore-string-values:
        - 'true'
        - 'True'
        - 'Help for '
        - 'Bearer '
        - 'https://'
        - '/dags\.tar\.gz'
        - 'The (new )?role for the '
    gocritic:
      disabled-checks:
        - dupImport
        - octalLiteral
        - whyNoLint
        - wrapperFunc
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 25
    govet:
      enable:
        - shadow
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - "2"
        - "10"
        - "64"
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    staticcheck:
      checks:
        - all
        - "-QF*"    # quickfix suggestions, fix incrementally
        - "-ST1005" # capitalized error strings, fix incrementally
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
    rules:
      # forbidigo backs up the archlint go test (internal/archlint): below the
      # cmd/ layer, v2 packages must report through callbacks and return errors,
      # not print/exit/log-fatal. Scope it to the v2 packages archlint guards
      # that live in this module, so it stays a lint-time guard for v2 and never
      # fires on the v1 tree, which prints by design. The v2 pkg/* modules have
      # their own go.mod and aren't reached by a root run, so archlint (which
      # walks the tree) is their only guard.
      # Keep this list in sync with v2BelowCmd and v2ConfigReaders in
      # internal/archlint/archlint_test.go when a new internal/ v2 package lands.
      - linters: [forbidigo]
        path-except: ^internal/(astrosession|checks|deploy|emenv|envresolve|instancelocate|instances|localenv|pack|plan|project|userstate|vaultenv)/
      - linters:
          - dupl
          - errcheck
          - goconst
          - gocyclo
          - gosec
          - mnd
          - unused
        path: _test\.go
      - path: (.+)\.go$
        text: 'shadow: declaration of .err. shadows declaration'
      - path: (.+)\.go$
        text: 'sloppyTestFuncName: function cleanUpInitFiles should be of form'
      # v2 tree: Deps and the contract structs (localrt, envresolve Inputs,
      # airflowapi's per-call options, instances.Instance) are passed by value
      # on purpose (docs/v2-architecture.md), so hugeParam does not apply.
      # `instance` is a prefix: it covers instances and instancelocate. Do not
      # "fix" it to a plural. `local` used to be one too, covering
      # localdocker/localstate/…; those moved into pkg/localrt (its own module,
      # which a root run does not descend into), leaving localenv as the only
      # internal/local* package. cmd/astro was listed here for the short-lived
      # v2 composition root; the name now holds the v1 Astro
      # tree, which gets no v2 exemption.
      - linters: [gocritic]
        path: ^(cmd/local|internal/(localenv|envresolve|deploy|instance|pack)|pkg/airflowapi)
        text: 'hugeParam:'
      # gosec rules newly surfaced in v2, fix incrementally
      - linters: [gosec]
        text: 'G115:'
      - linters: [gosec]
        text: 'G117:'
      - linters: [gosec]
        text: 'G122:'
      - linters: [gosec]
        text: 'G602:'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/astronomer/astro-cli)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
