version: "2"
run:
  timeout: 3m
linters:
  default: none
  enable:
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - exhaustive
    - forbidigo
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - mnd
    - nakedret
    - nolintlint
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    errcheck:
      # Flag `_ = f()` too, not just unchecked returns. The exclusions below
      # cover the writes that genuinely cannot fail in a way we can act on.
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprintf
        - fmt.Fprintln
    forbidigo:
      forbid:
        - pattern: '^fmt\.Print(f|ln)?$'
        - pattern: '^os\.Exit$'
        - pattern: '^log\.(Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$'
      analyze-types: true
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
      ignore-string-values:
        - 'true'
        - 'True'
        - 'Help for '
        - 'Bearer '
        - 'https://'
        - '/dags\.tar\.gz'
        - 'The (new )?role for the '
    gocritic:
      disabled-checks:
        - dupImport
        - octalLiteral
        - whyNoLint
        - wrapperFunc
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 25
    govet:
      enable:
        - shadow
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - "2"
        - "10"
        - "64"
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    staticcheck:
      checks:
        - all
        - "-QF*"    # quickfix suggestions, fix incrementally
        - "-ST1005" # capitalized error strings, fix incrementally
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
    rules:
      # forbidigo backs up the archlint go test (internal/archlint): below the
      # cmd/ layer, core packages must report through callbacks and return
      # errors, not print/exit/log-fatal. Scope it to the core packages archlint
      # guards that live in this module, so it stays a lint-time guard for the
      # core and never fires on the shell, which prints by design. The core
      # pkg/* modules have their own go.mod and aren't reached by a root run,
      # so archlint (which walks the tree) is their only guard.
      # Keep this list in sync with coreBelowCmd and coreConfigReaders in
      # internal/archlint/archlint_test.go when a new internal/ core package lands.
      - linters: [forbidigo]
        path-except: ^internal/(apirequest|astrosession|containercfg|deploy|emenv|envresolve|instancelocate|localenv|pack|plan|project|userstate|vaultenv)/
      - linters:
          - dupl
          - errcheck
          - goconst
          - gocyclo
          - gosec
          - mnd
          - unused
        # instancestest and cliouttest are test-only code that is not in a
        # _test.go file (an importable helper package cannot be), so they need
        # naming here to keep the exemption they had in the test files they
        # replaced. Unanchored: golangci-lint matches this against the path it
        # reports, which is relative to this config rather than to the module
        # dir that `make lint-submodules` runs each sub-module from.
        path: (_test\.go|instancestest/|cliouttest/)
      - path: (.+)\.go$
        text: 'shadow: declaration of .err. shadows declaration'
      - path: (.+)\.go$
        text: 'sloppyTestFuncName: function cleanUpInitFiles should be of form'
      # Core packages: Deps and the contract structs (localrt's Plan, Callbacks and
      # Record, envresolve Inputs, plan.Options, airflowapi's per-call options,
      # imagebuild.Request, proxy.Route, instances.Instance) are passed by value
      # on purpose (docs/architecture.md), so hugeParam does not apply.
      # `instance` is a prefix in BOTH groups: it covers instances and
      # instancelocate. Do not "fix" either to a plural.
      # `local` used to be one too, covering
      # localdocker/localstate/…; those moved into pkg/localrt, which is named
      # here in its own right. A root run does not descend into a nested module,
      # but `make lint-submodules` runs each one from its own directory and
      # golangci-lint still reports paths relative to THIS file — so one
      # repo-rooted pattern covers both runs. cmd/astro was listed here for the
      # short-lived core composition root; the name now
      # holds the shell Astro tree, which gets no core exemption.
      - linters: [gocritic]
        path: ^(cmd/local|internal/(localenv|envresolve|deploy|instance|pack|plan)|pkg/(airflowapi|imagebuild|instance|awsauth|googleauth|localrt|proxy))
        text: 'hugeParam:'
      # gosec rules newly surfaced in v2, fix incrementally
      - linters: [gosec]
        text: 'G115:'
      - linters: [gosec]
        text: 'G117:'
      - linters: [gosec]
        text: 'G122:'
      - linters: [gosec]
        text: 'G602:'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/astronomer/astro-cli)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
