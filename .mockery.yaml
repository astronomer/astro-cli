---
filename: "{{.InterfaceName}}.go"
outpkg: "{{.PackageName}}_mocks"
mockname: "{{.InterfaceName}}"
with-expecter: false
packages:
  github.com/astronomer/astro-cli/houston:
    config:
      dir: houston/mocks
    interfaces:
      ClientInterface:
  github.com/astronomer/astro-cli/internal/imagepush:
    config:
      dir: internal/imagepush/mocks
      outpkg: mocks
    interfaces:
      RegistryHandler:
      ImageHandler:
      # Only imagepush's own tests use this one, and mocks/ imports imagepush
      # (ImageHandler's Build takes an ImageBuildConfig), so it gets a package
      # of its own: in mocks/ it would be an import cycle.
      DockerRegistryAPI:
        config:
          dir: internal/imagepush/mocks/dockerapi
          outpkg: dockerapi
  github.com/astronomer/astro-cli/internal/platform/astro/clients/astrov1:
    config:
      dir: internal/platform/astro/clients/astrov1/mocks
    interfaces:
      ClientWithResponsesInterface:
        config:
          filename: client.go
  github.com/astronomer/astro-cli/internal/platform/astro/clients/astrov1alpha1:
    config:
      dir: internal/platform/astro/clients/astrov1alpha1/mocks
    interfaces:
      ClientWithResponsesInterface:
        config:
          filename: client.go
  github.com/astronomer/astro-cli/pkg/azure:
    config:
      dir: pkg/azure/mocks
    interfaces:
      Azure:
  # Container-runtime interfaces live in the pkg/container submodule. mockery
  # loads it through the root module's replace directive and writes into
  # pkg/container/mocks; the submodule's own go.mod stays testify-only (mockery
  # only ever runs from the root module here).
  github.com/astronomer/astro-cli/pkg/container:
    config:
      dir: pkg/container/mocks
      outpkg: mocks
    interfaces:
      OSChecker:
      DockerEngine:
      PodmanEngine:
